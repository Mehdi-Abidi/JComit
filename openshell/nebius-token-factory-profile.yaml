# OpenShell provider profile for Nebius Token Factory (OpenAI-compatible API).
# The real key stays with the gateway; the sandbox only sees a placeholder.
#   openshell provider profile import openshell/nebius-token-factory-profile.yaml
#   NEBIUS_API_KEY=... openshell provider create --name nebius --type nebius-token-factory --credential NEBIUS_API_KEY
#   openshell sandbox provider attach jcomit nebius

id: nebius-token-factory
display_name: Nebius Token Factory
description: Nebius Token Factory OpenAI-compatible inference API
category: inference
credentials:
- name: api_key
  description: Nebius Token Factory API key
  env_vars:
  - NEBIUS_API_KEY
  required: true
  auth_style: bearer
  header_name: authorization
  query_param: ''
endpoints:
- host: api.tokenfactory.nebius.com
  port: 443
  protocol: rest
  access: read-write
  enforcement: enforce
binaries: []
inference_capable: true
