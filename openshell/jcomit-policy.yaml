# OpenShell sandbox policy for JComit.
# Deny by default. Python may call the model API and nothing else.
# Apply changes to a running sandbox with:
#   openshell policy set jcomit --policy openshell/jcomit-policy.yaml

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  nebius_token_factory:
    name: nebius_token_factory
    endpoints:
      - host: api.tokenfactory.nebius.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: GET, path: "/v1/models" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }

  # Temporary: NVIDIA hosted Nemotron, used until Token Factory access is approved.
  nvidia_build:
    name: nvidia_build
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: "/v1/chat/completions" }
          - allow: { method: GET, path: "/v1/models" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }
