User tinyproxy
Group tinyproxy
Port 8888
Timeout 120

LogFile "/var/log/tinyproxy/egress.log"
LogLevel Connect

# Only containers on the private sandbox network may use the proxy.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Default deny. Hosts must be listed in allowlist.txt to get through.
Filter "/etc/tinyproxy/allowlist.txt"
FilterDefaultDeny Yes
FilterExtended Yes
FilterURLs Off

ConnectPort 443
