# Generated by `python -m jcomit.policy`. Edit skills.py, not this file.
version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /app            # JComit code, baked into the image
    - /sandbox        # home: Python runtime and config
  read_write:
    - /sandbox/data   # statements, memory.db, outputs and the action log
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  nebius_token_factory:
    name: nebius_token_factory
    # used by: categorize, monthly_review
    endpoints:
      - host: api.tokenfactory.nebius.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/v1/models" }
          - allow: { method: POST, path: "/v1/chat/completions" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/local/bin/python3 }
      - { path: /sandbox/.venv/bin/python3 }
